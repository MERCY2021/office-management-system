
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Tasks - Office Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
    <script src="tasks.js"></script>
<body>
    <header>
        <h1>Office Management System</h1>
        <p>Employee Task Management</p>
    </header>

    <div class="container">
        <h2>Manage Employee Tasks</h2>

        <div class="card">
            <h3>Assign a Task</h3>

            <form id="taskForm">
                <label for="taskTitle">Task Title</label>
                <input type="text" id="taskTitle" required
                       placeholder="Enter task title">

                <label for="taskDescription">Description</label>
                <textarea id="taskDescription"
                          placeholder="Describe the task"></textarea>

                <label for="assignedEmployee">Assign to Employee</label>
                <select id="assignedEmployee" required>
                    <option value="">Select an employee</option>
                </select>

                <label for="taskDeadline">Deadline</label>
                <input type="date" id="taskDeadline" required>

                <label for="taskPriority">Priority</label>
                <select id="taskPriority" required>
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>

                <label for="taskStatus">Status</label>
                <select id="taskStatus" required>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>

                <br><br>
                <button type="submit">Assign Task</button>
            </form>
        </div>
    <p><a href="index.html">← Back to Dashboard</a></p>

    <script src="tasks.js"></script>
</body>
</html>
        <div class="card">
            <h3>Task List</h3>

            <label for="taskSearch">Search Tasks</label>
            <input type="text" id="taskSearch"
                   placeholder="Search by task or employee">

            <label for="statusFilter">Filter by Status</label>
            <select id="statusFilter">
                <option value="">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>

            <table border="1" width="100%" cellpadding="10">
                <thead>
                    <tr>
                        <th>Task</th>
                        <th>Employee</th>
                        <th>Deadline</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="taskList"></tbody>
            </table>
        </div>

        <p><a href="index.html">← Back to Dashboard</a></p>
    </div>
</body>
</html>
