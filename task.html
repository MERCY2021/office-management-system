
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Tasks - Office Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="oms-body">

    <header>
        <h1>Office Management System</h1>
        <p>Employee Task Management</p>
    </header>

    <div class="container">

        <h2>Manage Employee Tasks</h2>

        <!-- ASSIGN TASK -->
        <div class="card">
            <h3>Assign a Task</h3>

            <form id="taskForm">

                <label for="taskTitle">Task Title</label>
                <input
                    type="text"
                    id="taskTitle"
                    required
                    placeholder="Enter task title"
                >

                <label for="taskDescription">Description</label>
                <textarea
                    id="taskDescription"
                    placeholder="Describe the task"
                ></textarea>

                <label for="assignedEmployee">Assign to Employee</label>
                <select id="assignedEmployee" required>
                    <option value="">Select an employee</option>
                </select>

                <label for="taskDeadline">Deadline</label>
                <input type="date" id="taskDeadline" required>

                <label for="taskPriority">Priority</label>
                <select id="taskPriority" required>
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>

                <label for="taskStatus">Status</label>
                <select id="taskStatus" required>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>

                <br><br>

                <button type="submit">Assign Task</button>

            </form>
        </div>

        <!-- EMPLOYEE CONNECTION CHECK -->
        <p id="employeeConnectionCheck">
            Checking employee records...
        </p>

        <!-- TASK LIST -->
        <div class="card">

            <h3>Task List</h3>

            <label for="taskSearch">Search Tasks</label>
            <input
                type="text"
                id="taskSearch"
                placeholder="Search by task or employee"
            >

            <label for="statusFilter">Filter by Status</label>
            <select id="statusFilter">
                <option value="">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>

            <div style="overflow-x: auto;">
                <table border="1" width="100%" cellpadding="10">
                    <thead>
                        <tr>
                            <th>Task</th>
                            <th>Employee</th>
                            <th>Deadline</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="taskList"></tbody>
                </table>
            </div>

        </div>

        <p>
            <a href="index.html">← Back to Dashboard</a>
        </p>

    </div>

    <!-- EMPLOYEE CONNECTION CHECK SCRIPT -->
    <script>
        try {
            const savedEmployees = localStorage.getItem("employees");
            const employeeCheck = document.getElementById(
                "employeeConnectionCheck"
            );

            if (savedEmployees) {
                const employees = JSON.parse(savedEmployees);

                employeeCheck.textContent = Array.isArray(employees)
                    ? "Employee records found: " + employees.length
                    : "Employee records need checking.";
            } else {
                employeeCheck.textContent =
                    "No employee records found on this page.";
            }
        } catch (error) {
            document.getElementById(
                "employeeConnectionCheck"
            ).textContent = "Unable to read employee records.";
        }
    </script>

    <!-- TASK MANAGEMENT JAVASCRIPT -->
    <script src="task.js"></script>

</body>
</html>
