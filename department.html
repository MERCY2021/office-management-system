
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department Management</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .department-content {
      padding: 24px;
    }

    .department-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .department-form input {
      padding: 12px;
      min-width: 220px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .department-form button,
    .department-actions button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .department-form button {
      background: #1f6feb;
      color: white;
    }

    .department-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .department-table th,
    .department-table td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    .department-actions button {
      margin: 3px;
    }

    .edit-button {
      background: #e8b949;
    }

    .delete-button {
      background: #dc3545;
      color: white;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Office System</h2>
    <a href="index.html">Dashboard</a>
    <a href="employees.html">Employees</a>
    <a href="departments.html">Departments</a>
  </div>

  <main class="department-content">
    <h1>Department Management</h1>
    <p>Add, view, edit and manage office departments.</p>

    <h3 id="departmentCount">Total Departments: 0</h3>

    <form id="departmentForm" class="department-form">
      <input
        type="text"
        id="departmentName"
        placeholder="Enter department name"
        required
      >
      <button type="submit" id="saveDepartment">Add Department</button>
      <button type="button" id="cancelEdit" hidden>Cancel</button>
    </form>

    <table class="department-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Department Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="departmentList"></tbody>
    </table>
  </main>

  <script>
    const form = document.getElementById("departmentForm");
    const nameInput = document.getElementById("departmentName");
    const departmentList = document.getElementById("departmentList");
    const countDisplay = document.getElementById("departmentCount");
    const saveButton = document.getElementById("saveDepartment");
    const cancelButton = document.getElementById("cancelEdit");

    let departments = JSON.parse(
      localStorage.getItem("departments") || "[]"
    );
    let editingIndex = -1;

    function saveDepartments() {
      localStorage.setItem("departments", JSON.stringify(departments));
    }

    function displayDepartments() {
      departmentList.innerHTML = "";

      departments.forEach((department, index) => {
        const row = document.createElement("tr");

        const numberCell = document.createElement("td");
        numberCell.textContent = index + 1;

        const nameCell = document.createElement("td");
        nameCell.textContent = department;

        const actionsCell = document.createElement("td");
        actionsCell.className = "department-actions";

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.className = "edit-button";
        editButton.addEventListener("click", () => editDepartment(index));

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete-button";
        deleteButton.addEventListener("click", () => deleteDepartment(index));

        actionsCell.append(editButton, deleteButton);
        row.append(numberCell, nameCell, actionsCell);
        departmentList.appendChild(row);
      });

      countDisplay.textContent =
        "Total Departments: " + departments.length;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const name = nameInput.value.trim();

      if (!name) return;

      const duplicate = departments.some(
        (department, index) =>
          department.toLowerCase() === name.toLowerCase() &&
          index !== editingIndex
      );

      if (duplicate) {
        alert("This department already exists.");
        return;
      }

      if (editingIndex === -1) {
        departments.push(name);
      } else {
        departments[editingIndex] = name;
      }

      saveDepartments();
      resetForm();
      displayDepartments();
    });

    function editDepartment(index) {
      editingIndex = index;
      nameInput.value = departments[index];
      saveButton.textContent = "Update Department";
      cancelButton.hidden = false;
      nameInput.focus();
    }

    function deleteDepartment(index) {
      if (!confirm("Are you sure you want to delete this department?")) {
        return;
      }

      departments.splice(index, 1);
      saveDepartments();

      if (editingIndex === index) {
        resetForm();
      } else if (editingIndex > index) {
        editingIndex--;
      }

      displayDepartments();
    }

    function resetForm() {
      editingIndex = -1;
      form.reset();
      saveButton.textContent = "Add Department";
      cancelButton.hidden = true;
    }

    cancelButton.addEventListener("click", resetForm);

    displayDepartments();
  </script>
</body>
</html>
