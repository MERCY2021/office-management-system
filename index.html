<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
    <h1>Office Management System</h1>
    <p>Manage your office efficiently</p>
</header>

<div class="container">

    <h2>Dashboard</h2>

    <div class="dashboard">

        <div class="card">
            <h3>Employees</h3>
            <p>Manage employee records and information.</p>
        </div>

        <div class="card">
            <h3>Tasks</h3>
            <p>Create and manage office tasks.</p>
        </div>

        <div class="card">
            <h3>Inventory</h3>
            <p>Track office equipment and supplies.</p>
        </div>

        <div class="card">
            <h3>Attendance</h3>
            <p>Track employee attendance.</p>
        </div>

    </div>

</div>

<footer>
    <p>Office Management System © 2026</p>
</footer>
</body>
</html>
