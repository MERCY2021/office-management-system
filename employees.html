<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees - Office Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>Office Management System</h1>
    <p>Employee Management</p>
</header>

<div class="container">

    <h2>Employee Management</h2>
    
<div class="card">
    <h3>Total Employees</h3>
    <p id="employeeCount">0</p>
</div>

    <div class="card">
        <h3>Add Employee</h3>

        <form id="employeeForm">

            <label>Full Name</label><br>
            <input type="text" id="name" required><br><br>

            <label>Position</label><br>
            <input type="text" id="position" required><br><br>

            <label>Email</label><br>
            <input type="email" id="email" required><br><br>

            <label>Phone</label><br>
            <input type="text" id="phone" required><br><br>

            <button type="submit">Add Employee</button>

        </form>
    </div>

    <br>   
<div class="card">
    <h3>Employee List</h3>

    <label for="employeeSearch">Search Employees</label>
    <input
        type="text"
        id="employeeSearch"
        placeholder="Search by name, position, email or phone..."
    >

        <table border="1" width="100%" cellpadding="10">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Position</th>
                    <th>Email</th>
                    <th>Phone</th>
<th>Action</th>
                </tr>
            </thead>

            <tbody id="employeeList">
            </tbody>
        </table>

    </div>

    <br>

    <a href="index.html">← Back to Dashboard</a>

</div>

<script src="script.js"></script>

</body>
</html>
